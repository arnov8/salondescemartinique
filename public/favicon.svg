<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#152a45"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Gold accent bar at top -->
  <rect x="96" y="72" width="320" height="6" rx="3" fill="#d4a012"/>
  <!-- CSE text -->
  <text x="256" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="220" fill="white" letter-spacing="-8">CSE</text>
  <!-- Gold accent bar at bottom -->
  <rect x="96" y="380" width="320" height="6" rx="3" fill="#d4a012"/>
  <!-- "MARTINIQUE" subtitle -->
  <text x="256" y="432" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="52" fill="#d4a012" letter-spacing="12">MARTINIQUE</text>
</svg>
